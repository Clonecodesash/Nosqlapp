services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - ../backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ../backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
